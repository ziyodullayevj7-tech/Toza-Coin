########################
#        SERVER
########################
server.port=${PORT:8081}
server.url=https://mazgi.uz
spring.config.import=optional:file:./secrets.properties

########################
#        DATABASE
########################
spring.datasource.url=jdbc:postgresql://localhost:5432/tozaCoin_db
spring.datasource.username=tozaCoin_user
spring.datasource.password=12345
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

########################
#        Attach        #
########################
attache.folder=attaches
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

########################
# GOOGLE VISION API    #
########################
google.vision.api.key=${GOOGLE_VISION_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
